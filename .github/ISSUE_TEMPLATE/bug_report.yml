name: Bug report
description: Something in smt-sudoku-mcp isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact tool call (name + arguments) that triggers it.
      placeholder: |
        1. Called `solve_sudoku_puzzle` with grid ...
        2. ...
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error messages or unexpected output verbatim.
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      options:
        - generate_sudoku_puzzle
        - validate_partial_sudoku_solution
        - validate_full_sudoku_solution
        - solve_sudoku_puzzle
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable-http
        - Not sure
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: smt-sudoku-mcp version
      placeholder: e.g. 0.1.0 (see pyproject.toml)
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Code, MCP Inspector
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
